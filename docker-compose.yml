version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stark
      POSTGRES_PASSWORD: stark
      POSTGRES_DB: stark_wms
    ports:
      - "5432:5432"
    volumes:
      - stark_wms_db:/var/lib/postgresql/data

volumes:
  stark_wms_db:
